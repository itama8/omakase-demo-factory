<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Omakase · Demo review</title>
    <link rel="stylesheet" href="/review.css" />
    <script type="module" src="/review.js"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/">Omakase <span>/ demo room</span></a>
      <div class="toolbar">
        <a id="library" href="/" hidden>Library</a>
        <label class="inline"
          >Take<select
            id="take"
            title="Switch to another kept take"
          ></select></label
        ><button id="reload">Reload</button
        ><label class="inline"
          >Format<select id="preset" title="Export format"></select></label
        ><button id="export" class="primary">Export</button
        ><a id="download" href="/download" hidden>Download ↓</a>
      </div>
    </header>
    <main>
      <section class="screen" aria-label="Demo preview">
        <h1 id="title">Loading demo…</h1>
        <div class="viewer">
          <div class="picture">
            <iframe id="film" title="Edited demo playback"></iframe>
            <div id="placement-layer" hidden>
              <div
                id="placement-box"
                tabindex="0"
                role="button"
                aria-label="Caption placement rectangle"
              >
                <span id="placement-label"></span
                ><span
                  class="resize-handle"
                  aria-label="Resize rectangle"
                ></span>
              </div>
            </div>
          </div>
          <div class="player-controls">
            <div class="transport">
              <button
                id="play"
                class="icon-button"
                aria-label="Play full video"
                title="Play full video"
              >
                <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 5v14l11-7z" /></svg
                ><svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 5h4v14H6zM14 5h4v14h-4z" />
                </svg></button
              ><output id="clock">0:00 / 0:00</output
              ><label><input id="sound" type="checkbox" /> Sound</label>
            </div>
            <div
              id="timeline"
              aria-label="Major events timeline. Ctrl-click and drag to add an edit range"
            >
              <input
                id="seek"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0"
                aria-label="Playback position"
              />
              <nav id="scenes" class="timeline-row" aria-label="Scenes"></nav>
              <div id="edit-ranges" aria-label="Edit ranges"></div>
              <div id="range-selection" hidden>
                <span class="range-handle start" data-edge="start"></span
                ><span class="range-handle end" data-edge="end"></span>
              </div>
              <div id="playhead" aria-hidden="true">
                <span id="timeline-caret"></span>
              </div>
            </div>
          </div>
        </div>
        <p id="status" role="status" aria-live="polite">Loading playback…</p>
        <details>
          <summary>Export progress</summary>
          <pre id="log">No export running.</pre>
        </details>
      </section>
      <aside aria-label="Edits">
        <div class="section-heading">
          <h2>Edits</h2>
          <button id="add-edit" type="button">+ Add edit</button>
        </div>
        <p class="hint">
          Ctrl-click and drag on the timeline to select an edit range. Add one
          or more effects to each edit.
        </p>
        <div class="edit-toolbar">
          <button
            id="undo"
            class="icon-button"
            type="button"
            title="Undo edit"
            aria-label="Undo edit"
            disabled
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m9 5-5 5 5 5M4 10h10a6 6 0 0 1 0 12" />
            </svg>
          </button>
        </div>
        <p id="edit-status" role="status" aria-live="polite"></p>
        <div id="edit-cards"></div>
        <p id="empty-edits" class="empty-state">No edits yet.</p>
      </aside>
    </main>
  </body>
</html>
