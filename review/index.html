<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Omakase · Demo review</title>
    <link rel="stylesheet" href="/review.css" />
    <script type="module" src="/review.js"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/">Omakase <span>/ demo room</span></a>
      <div>
        <label class="inline"
          >Take<select id="take" title="Switch to another kept take"></select></label
        ><button id="reload">Reload</button
        ><label class="inline"
          >Format<select id="preset" title="Export format"></select></label
        ><button id="export" class="primary">Export</button
        ><a id="download" href="/download" hidden>Download ↓</a>
      </div>
    </header>
    <main>
      <section class="screen" aria-label="Demo preview">
        <h1 id="title">Loading demo…</h1>
        <div class="viewer">
          <div class="picture">
            <iframe id="film" title="Edited demo playback"></iframe>
          </div>
          <div class="player-controls">
            <div class="transport">
              <button
                id="play"
                class="icon-button"
                aria-label="Play full video"
                title="Play full video"
              >
                <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 5v14l11-7z" /></svg
                ><svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 5h4v14H6zM14 5h4v14h-4z" />
                </svg></button
              ><output id="clock">0:00 / 0:00</output
              ><label><input id="sound" type="checkbox" /> Sound</label>
            </div>
            <div id="timeline" aria-label="Scene and step timeline">
              <input
                id="seek"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0"
                aria-label="Playback position"
              />
              <nav id="scenes" class="timeline-row" aria-label="Scenes"></nav>
              <nav id="steps" class="timeline-row" aria-label="Steps"></nav>
              <div id="playhead" aria-hidden="true">
                <span id="timeline-caret"></span>
              </div>
              <div
                id="timeline-menu"
                role="group"
                aria-label="Short steps"
                hidden
              ></div>
            </div>
          </div>
        </div>
        <p id="status" role="status" aria-live="polite">Loading playback…</p>
        <details>
          <summary>Export progress</summary>
          <pre id="log">No export running.</pre>
        </details>
      </section>
      <aside aria-label="Edit selected moment">
        <form id="editor">
          <label>Editing<select id="span" required></select></label>
          <div class="save-row">
            <button
              class="primary icon-button"
              id="save"
              type="submit"
              aria-label="Save changes"
              title="Save changes"
              disabled
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 3h12l4 4v14H3V3zm2 2v5h10V5zm0 10v4h10v-4z" />
              </svg>
            </button>
            <button
              class="icon-button"
              id="undo"
              type="button"
              aria-label="Undo save"
              title="Undo save"
              disabled
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M9 5 4 10l5 5M4 10h10a6 6 0 0 1 0 12"
                  style="
                    fill: none;
                    stroke: currentColor;
                    stroke-width: 2;
                    stroke-linecap: round;
                    stroke-linejoin: round;
                  "
                />
              </svg>
            </button>
            <button
              class="icon-button"
              id="discard"
              type="button"
              aria-label="Discard changes"
              title="Discard changes"
              disabled
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="m6 6 12 12M18 6 6 18"
                  style="
                    fill: none;
                    stroke: currentColor;
                    stroke-width: 2;
                    stroke-linecap: round;
                  "
                />
              </svg>
            </button>
          </div>
          <p id="edit-status" role="status" aria-live="polite">
            Select a scene or step.
          </p>
          <fieldset>
            <legend>Timing</legend>
            <div class="pair">
              <label
                >Keep from (seconds)<input
                  id="trim-start"
                  type="number"
                  min="0"
                  step="any"
                  value="0" /></label
              ><label
                >Keep until (seconds)<input
                  id="trim-end"
                  type="number"
                  min="0"
                  step="any"
                  value="0"
              /></label>
            </div>
            <label
              >Speed<select id="speed">
                <option value="">Automatic</option>
                <option value="0.5">0.5× · slower</option>
                <option value="0.75">0.75×</option>
                <option value="1">1× · original</option>
                <option value="1.5">1.5×</option>
                <option value="2">2× · faster</option>
                <option value="3">3×</option>
                <option value="5">5×</option>
              </select></label
            >
            <label class="check"
              ><input id="cut" type="checkbox" /> Remove this moment</label
            >
          </fieldset>
          <fieldset>
            <legend>Caption</legend>
            <textarea
              id="caption"
              aria-label="Caption text"
              rows="2"
              maxlength="240"
              placeholder="Add a caption"
            ></textarea
            ><label
              >Position<select id="position">
                <option value="bottom">Bottom</option>
                <option value="top">Top</option>
              </select></label
            >
          </fieldset>
          <fieldset>
            <legend>Camera</legend>
            <label
              >Zoom <output id="zoom-value">1×</output
              ><input
                id="zoom"
                type="range"
                min="1"
                max="4"
                step="0.01"
                value="1"
            /></label>
            <input id="camera-x" type="hidden" value="0.5" />
            <input id="camera-y" type="hidden" value="0.5" />
            <div id="camera-grid" aria-label="Zoom placement grid">
              <button
                id="camera-window"
                type="button"
                aria-label="Zoom placement window"
                title="Drag to position. Arrow keys move; Home centres."
              ></button>
            </div>
            <button id="auto-camera" type="button">Automatic framing</button>
          </fieldset>
        </form>
        <details id="saved-edits">
          <summary>Saved edits <span id="edit-count"></span></summary>
          <ol id="edits"></ol>
        </details>
      </aside>
    </main>
  </body>
</html>
