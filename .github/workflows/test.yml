name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Every screenplay must validate against the action vocabulary. Recording needs the built app and runs locally.
      - run: node bin/demo.mjs validate
        env:
          OMAKASE_ROOT: /nonexistent
