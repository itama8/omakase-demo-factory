title: Cache study
vault: demo-notes
sushi: replies.mjs
setup:
  - keystroke-hud: on
  - sidebar: closed
scenes:
  - name: study
    steps:
      - rename: Cache sweep
      - project-tag: cache-study
      - focus: "One cache study, from question to chart"
      - type: |-
          # Cache sweep

          Keep the working set in L1
        wpm: 100
      - inline-sushi: finish the sentence
        reads: smaller tiles
      - pause: 1s
  - name: table
    steps:
      - caret: end
      - press: Enter
      - focus: "Turn a question into an editable table"
      - ask-sushi: Make a table of L1 miss rate for block sizes 16, 32 and 64
        answer: Block size
      - card-action: merge
        reads: "| Block size |"
      - pause: 1.5s
  - name: chart
    steps:
      - caret: end
      - press: Enter
      - focus: "Chart measurements from a CSV"
      - csv-chart: speedup.csv
      - pause: 2s
  - name: dictate
    steps:
      - caret: end
      - press: Enter
      - focus: "Review a dictated thought before inserting it"
      - dictation: fixture
        reads: fixture transcript
      - focus: ""
      - pause: 2s
