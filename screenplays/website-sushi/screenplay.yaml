title: Sushi check
vault: ../omakase-demo-factory/screenplays/website-sushi/vault
appearance: { theme: retro-82, font: plex-notebook }
sushi: gemini
capture: { window: [1680, 1000] }
film: { intro: none, outro: none, camera: still, slug: sushi, poster: 24 }

setup:
  - sidebar: open
  - open-note: Sewer check
  - attach-pdf: manual.pdf
  - caret: end

scenes:
  - name: ask
    steps:
      - pause: 1.3s
      - ask-sushi: Using the open manual, which conduits in this table fall below the minimum velocity?
        cites: pdf
      - pause: 3.5s
  - name: cite
    steps:
      # Move the manual away first, so the jump to the cited page is visible.
      - pdf-page: 4
      - pause: 900ms
      - citation
      - pause: 3.2s
  - name: merge
    steps:
      - card-action: merge
      - pause: 2.6s
