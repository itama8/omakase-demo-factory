<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Omakase demo</title>
    <script src="gsap.min.js"></script>
    <!-- The film plan: the camera's shots in film time. Written by src/project.mjs. -->
    <script src="film.js"></script>
    <style>
      @font-face {
        font-family: "Plex Serif";
        src: url("assets/IBMPlexSerif-Regular.ttf") format("truetype");
      }
      body {
        margin: 0;
        background: #07171d;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07171d;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: #07171d;
      }
      #logo {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 44px;
      }
      #logo-mark {
        display: block;
        width: 240px;
        height: 240px;
      }
      /* #app carries the seam, #camera carries the shots. The videos are the
         timed clips, so neither wrapper may be timed. */
      #app,
      #camera {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      .take {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        object-fit: cover;
      }
      #curtain {
        position: absolute;
        inset: 0;
        background: #02090d;
      }
      .caption { position: absolute; inset-inline: 80px; display: flex; justify-content: center; pointer-events: none; z-index: 5; }
      .caption.top { top: 56px; }
      .caption.bottom { bottom: 56px; }
      .caption span { max-width: 1500px; padding: 18px 36px; border-radius: 40px; background: #07171deb; color: #fff; font: 36px/1.3 system-ui, sans-serif; text-align: center; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="__DURATION__">
      <div id="ground"></div>
      <div id="app">
        <div id="camera">
          __VIDEOS__
        </div>
      </div>
      <section id="logo" class="clip" data-start="0" data-duration="__LOGO__" data-track-index="1">
        <img id="logo-mark" src="assets/icon.png" alt="" />
      </section>
      <div id="curtain"></div>
      __AUDIO__
      __CAPTIONS__
    </div>
    <script>
      window.__buildTimeline = (film) => {
      window.__timelines?.main?.kill();
      const W = 1920;
      const H = 1080;
      const CUT = film.logo;
      const tl = gsap.timeline({ paused: true });

      // --- Logo, in silence. One seam: a push through the mark into the app.
      tl.fromTo("#logo-mark", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.25);
      tl.fromTo("#logo", { scale: 1 }, { scale: 1.32, duration: 0.42, ease: "power4.in" }, CUT - 0.42);
      tl.fromTo("#logo", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.in" }, CUT - 0.2);
      tl.fromTo("#app", { scale: 0.9, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.6, ease: "power4.out" }, CUT);

      // --- Camera. The shots arrive planned; this only plays them.
      const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
      // Centre the point (x, y), given as fractions of the window, at this
      // zoom, without ever showing past the edge of the footage.
      const pose = ({ x, y, zoom }) => ({ scale: zoom, x: clamp(W / 2 - x * W * zoom, W - W * zoom, 0), y: clamp(H / 2 - y * H * zoom, H - H * zoom, 0) });
      let from = pose({ x: 0.5, y: 0.5, zoom: 1 });
      gsap.set("#camera", { transformOrigin: "0 0", ...from });
      for (const shot of film.shots) {
        // Shots never overlap, so each starts from the pose the last one reached.
        const to = pose(shot.frame);
        tl.fromTo("#camera", { ...from }, { ...to, duration: shot.duration, ease: shot.ease, immediateRender: false }, shot.t);
        from = to;
      }

      // --- End clean.
      tl.fromTo("#curtain", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.in" }, film.duration - 0.7);
      for (const [i, caption] of film.captions.entries()) {
        const fade = Math.min(0.25, caption.duration / 4);
        tl.fromTo(`#caption-${i}`, { opacity: 0, y: caption.position === "top" ? -8 : 8 }, { opacity: 1, y: 0, duration: fade, ease: "power2.out", immediateRender: false }, caption.start);
        tl.to(`#caption-${i}`, { opacity: 0, duration: fade }, caption.start + caption.duration - fade);
      }
      window.__timelines ??= {};
      window.__timelines["main"] = tl;
      };
      window.__buildTimeline(window.__film);
    </script>
    <script src="player.js"></script>
  </body>
</html>
